theme = "catppuccin_mocha_transparent"

[keys.normal]
C-e = ["select_all", "delete_selection_noyank", ":clipboard-paste-before"]
C-y = ["save_selection", "select_all", ":clipboard-yank", "jump_backward"]
X = ["extend_line_up", "extend_to_line_bounds"]
Z = { Z = ":wqa", Q = ":qa!" }
"C-s" = ":wa"
"C-r" = ":reload-all"
V = [":vsplit", ":buffer-next"]
Y = ":clipboard-yank"
D = [":clipboard-yank", "delete_selection"]
"ç" = [":clipboard-yank", "change_selection"]
"π" = ":clipboard-paste-after"
"C-p" = ":clipboard-paste-before"
"'" = "keep_primary_selection"

[keys.normal.space]
d = ["select_mode", "goto_line_end", "delete_selection"]
c = ["select_mode", "goto_line_end", "change_selection"]
o = ":run-shell-command uvx ruff check --select I --fix . > /dev/null 2>&1"

[keys.select]
Y = ":clipboard-yank"

[keys.insert]
k = { j = "normal_mode" }
"C-s" = ":wa"
"C-r" = ":reload-all"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
true-color = true
clipboard-provider = "termcode"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.lsp]
display-inlay-hints = true
